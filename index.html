<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ops-task-flow · 游戏运营任务的人机协作流程台账</title>
<meta name="description" content="把 12 项游戏运营岗位任务里的 11 项拆成 74 步，每一步写清 AI 做什么、人做什么、在哪交接、凭什么这么分。">
<style>
  /* 设计令牌：共用层 + theme-light，值与工具本体 :root 逐条一致 */
  :root{
    --bg:#f5f4f1; --surface:#fffefc; --surface-2:#faf9f6; --surface-3:#f1efe9;
    --line:rgba(28,26,22,.10); --line-2:rgba(28,26,22,.06); --line-strong:rgba(28,26,22,.20);
    --ink:#1c1a17; --ink-2:#4a463f; --muted:#7d766b;
    --accent:#b45309; --accent-dark:#8a3d05; --accent-soft:#fdf2e3;
    --mach:#b45309; --mach-soft:#fdf4e8; --mach-line:#eedcbe;
    --human:#0f766e; --human-soft:#edf8f6; --human-line:#c6e8e1;
    --hand:#4338ca; --hand-soft:#eef0fe; --hand-line:#d7dafb;
    --alert:#b91c1c; --alert-soft:#fdf3f3; --alert-line:#f2d6d6;
    --r-sm:6px; --r-md:10px; --r-lg:14px;
    --sh-1:0 1px 2px rgba(28,26,22,.05);
    --sh-2:0 2px 8px rgba(28,26,22,.07), 0 1px 2px rgba(28,26,22,.04);
    --sh-3:0 10px 28px rgba(28,26,22,.10);
    --mono:"Cascadia Mono",Consolas,"SFMono-Regular",ui-monospace,monospace;
    --sans:"Source Han Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    --ease:cubic-bezier(0.16,1,0.3,1);
    --dur-fast:160ms; --dur-base:320ms; --dur-slow:640ms;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:40px;
    --fs-1:12.5px; --fs-2:14px; --fs-3:16px; --fs-4:17px; --fs-5:24px; --fs-6:32px;
    --hairline:1px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs-3);line-height:1.7}
  .wrap{max-width:1060px;margin:0 auto;padding:0 var(--sp-5)}
  a:focus-visible,.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  header.tb{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3);
    padding:var(--sp-4) 0 var(--sp-3);border-bottom:var(--hairline) solid var(--line-strong)}
  .repo{font-family:var(--mono);font-size:var(--fs-2);color:var(--ink-2)}
  .sheet{font-family:var(--mono);font-size:var(--fs-1);color:var(--ink-2)}

  main{padding:var(--sp-6) 0 var(--sp-5)}
  .cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--sp-6);align-items:start}
  h1{font-size:var(--fs-6);line-height:1.3;font-weight:700;letter-spacing:-.01em;margin-bottom:var(--sp-3)}
  .lead{color:var(--ink-2);margin-bottom:var(--sp-4);max-width:34em}
  .trust{padding:var(--sp-2) 0;margin-bottom:var(--sp-5);
    border-top:var(--hairline) solid var(--line);border-bottom:var(--hairline) solid var(--line)}
  .trust b{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
    background:var(--accent);color:var(--surface);font-size:var(--fs-4);font-weight:600;
    text-decoration:none;padding:var(--sp-3) var(--sp-5);border-radius:var(--r-sm);
    transition:background-color var(--dur-fast) var(--ease)}
  .btn:hover{background:var(--accent-dark)}
  .btn .ar{font-family:var(--mono);font-weight:400}
  .sub{margin-top:var(--sp-4);display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-3);font-size:var(--fs-2)}
  .sub a{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
  .sub a:hover{color:var(--ink)}
  .sub .sep{color:var(--ink-2)}

  figure.swim{background:var(--surface);border:var(--hairline) solid var(--line);
    border-radius:var(--r-md);padding:var(--sp-3)}
  .fh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--sp-1) var(--sp-2);
    font-family:var(--mono);font-size:var(--fs-1);color:var(--ink-2);padding:0 var(--sp-1) var(--sp-2)}
  .lanes{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);
    border:var(--hairline) solid var(--line)}
  .lh{font-family:var(--mono);font-size:var(--fs-1);font-weight:600;color:var(--ink-2);padding:var(--sp-1) var(--sp-2)}
  .lh.m{grid-column:1;background:var(--mach-soft);border-bottom:var(--hairline) solid var(--mach-line)}
  .lh.g{grid-column:2;background:var(--surface)}
  .lh.h{grid-column:3;background:var(--human-soft);border-bottom:var(--hairline) solid var(--human-line)}
  .cm{grid-column:1;background:var(--mach-soft);padding:5px 6px}
  .cg{grid-column:2;background:var(--surface);position:relative}
  .ch{grid-column:3;background:var(--human-soft);padding:5px 6px}
  .step{background:var(--surface);border:var(--hairline) solid var(--mach-line);
    border-radius:var(--r-sm);padding:var(--sp-1) var(--sp-2)}
  .ch .step{border-color:var(--human-line)}
  .step .no{font-family:var(--mono);font-size:var(--fs-1);color:var(--ink-2);margin-right:var(--sp-1)}
  .step .nm{font-size:var(--fs-2);font-weight:600;color:var(--ink)}
  .step .nt{display:block;font-size:var(--fs-1);color:var(--ink-2);margin-top:1px}
  .hx{position:absolute;inset:0}
  .hx::before{content:"";position:absolute;top:-5px;height:1px;width:calc(50% + 6px);background:var(--hand)}
  .hx.from-h::before{right:-6px}
  .hx.from-m::before{left:-6px}
  .hx b{position:absolute;left:50%;top:-5px;bottom:50%;width:1px;background:var(--hand)}
  .hx u{position:absolute;top:50%;height:1px;width:calc(50% + 6px);background:var(--hand)}
  .hx.to-m u{left:-6px}
  .hx.to-h u{right:-6px}
  .hx u::after{content:"";position:absolute;top:-3px;width:0;height:0;
    border-top:3px solid transparent;border-bottom:3px solid transparent}
  .hx.to-m u::after{left:-4px;border-right:5px solid var(--hand)}
  .hx.to-h u::after{right:-4px;border-left:5px solid var(--hand)}
  .fc{font-size:var(--fs-1);color:var(--ink-2);padding:var(--sp-2) var(--sp-1) 0}

  footer{border-top:var(--hairline) solid var(--line-strong);padding:var(--sp-3) 0 var(--sp-5);
    font-size:var(--fs-2);color:var(--ink-2);display:flex;flex-wrap:wrap;gap:var(--sp-1) var(--sp-2)}
  footer a{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
  footer a:hover{color:var(--ink)}

  @media (max-width:860px){
    .cols{grid-template-columns:1fr;gap:var(--sp-5)}
  }
  @media (max-width:560px){
    .wrap{padding:0 var(--sp-4)}
    main{padding:var(--sp-5) 0}
    .btn{width:100%}
    .lanes{grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr)}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="tb">
    <span class="repo">ops-task-flow</span>
    <span class="sheet">流程台账 / 工具入口</span>
  </header>

  <main>
    <div class="cols">
      <section class="intro">
        <h1>游戏运营任务的人机协作流程台账</h1>
        <p class="lead">把 12 项岗位任务里的 11 项拆成 74 步，每一步写清六件事：AI 做什么、人做什么、在哪交接、产出什么、出错怎么办、凭什么这么分。</p>
        <p class="trust"><b>11</b> 项岗位任务、<b>74</b> 步、<b>74</b> 处交接，每一步都写了判定依据。</p>

      </section>

      <figure class="swim">
        <p class="fh"><span>泳道示意 · 玩家反馈日报</span><span>箭头＝交接点</span></p>
        <div class="lanes" role="img" aria-label="泳道示意图：机器泳道与人泳道各排步骤，跨泳道的箭头是交接点。第 1 步人定口径，交给机器第 2 步采集与规范化、第 3 步分类打标；第 3 步交回人第 4 步紧急项升级；第 4 步交给机器第 5 步成文、第 6 步交付前自检。">
          <span class="lh m">机器</span><span class="lh g"></span><span class="lh h">人</span>

          <div class="cm"></div>
          <div class="cg"></div>
          <div class="ch"><div class="step"><span class="no">01</span><span class="nm">定口径</span><span class="nt">人拍板</span></div></div>

          <div class="cm"><div class="step"><span class="no">02</span><span class="nm">采集与规范化</span><span class="nt">机器全包</span></div></div>
          <div class="cg"><i class="hx from-h to-m" aria-hidden="true"><b></b><u></u></i></div>
          <div class="ch"></div>

          <div class="cm"><div class="step"><span class="no">03</span><span class="nm">分类打标</span><span class="nt">人只看例外</span></div></div>

          <div class="cm"></div>
          <div class="cg"><i class="hx from-m to-h" aria-hidden="true"><b></b><u></u></i></div>
          <div class="ch"><div class="step"><span class="no">04</span><span class="nm">紧急项升级</span><span class="nt">人拍板</span></div></div>

          <div class="cm"><div class="step"><span class="no">05</span><span class="nm">成文</span><span class="nt">人过一遍</span></div></div>
          <div class="cg"><i class="hx from-h to-m" aria-hidden="true"><b></b><u></u></i></div>
          <div class="ch"></div>

          <div class="cm"><div class="step"><span class="no">06</span><span class="nm">交付前自检</span><span class="nt">人只看例外</span></div></div>
          <div class="cg"></div>

        <figcaption class="fc">工具里 11 项任务都这样画。点任意一步，看六件事的细节与判定依据。</figcaption>
      </figure>
    </div>
  </main>
