<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运营任务的人机协作流程</title>
<style>
  /* ============================================================
     设计令牌 —— 方向：工业实用（Industrial / utilitarian）
     主色 60% 暖中性纸面 ／ 结构 30% 发丝线 ／ 强调 10% 琥珀
     颜色承担数据含义（机器·人·交接），其余一律中性
     ============================================================ */
  :root{
    --bg:#f5f4f1; --surface:#fffefc; --surface-2:#faf9f6; --surface-3:#f1efe9;
    --line:rgba(28,26,22,.10); --line-2:rgba(28,26,22,.06); --line-strong:rgba(28,26,22,.20);
    --ink:#1c1a17; --ink-2:#4a463f; --muted:#7d766b;
    --accent:#b45309; --accent-dark:#8a3d05; --accent-soft:#fdf2e3;
    --mach:#b45309; --mach-soft:#fdf4e8; --mach-line:#eedcbe;
    --human:#0f766e; --human-soft:#edf8f6; --human-line:#c6e8e1;
    --hand:#4338ca; --hand-soft:#eef0fe; --hand-line:#d7dafb;
    --alert:#b91c1c; --alert-soft:#fdf3f3; --alert-line:#f2d6d6;
    --r-sm:6px; --r-md:10px; --r-lg:14px;
    --sh-1:0 1px 2px rgba(28,26,22,.05);
    --sh-2:0 2px 8px rgba(28,26,22,.07), 0 1px 2px rgba(28,26,22,.04);
    --sh-3:0 10px 28px rgba(28,26,22,.10);
    --mono:"Cascadia Mono",Consolas,"SFMono-Regular",ui-monospace,monospace;
    --sans:"Source Han Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    --ease:cubic-bezier(0.16,1,0.3,1);
    --dur-fast:160ms; --dur-base:320ms; --dur-slow:640ms;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:14px; line-height:1.7; letter-spacing:.01em;
    padding:22px 20px 64px;
  }
  /* 氛围层：极淡的工程网格 + 左上暖光，克制到只提供质感 */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(52rem 34rem at 6% -8%, rgba(180,83,9,.07), transparent 62%),
      repeating-linear-gradient(0deg, rgba(28,26,22,.022) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(28,26,22,.022) 0 1px, transparent 1px 28px);
  }
  .wrap{max-width:1240px;margin:0 auto;position:relative;z-index:1}
  a{color:var(--accent-dark)}

  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  h1{font-size:21px;font-weight:600;letter-spacing:-.015em;line-height:1.25;
    padding-left:13px;border-left:3px solid var(--accent)}
  h1 span{color:var(--accent)}
  .post{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em}

  .layout{display:grid;grid-template-columns:246px 1fr;gap:20px;align-items:start}
  .side{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:14px;box-shadow:var(--sh-1)}
  .side h2{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.10em;
    color:var(--muted);margin:16px 0 8px}
  .side h2:first-child{margin-top:0}
  .maincol{min-width:0}

  .switch{display:block;margin:0}
  .tbtn{display:block;width:100%;text-align:left;background:var(--surface-2);
    border:1px solid var(--line);border-radius:var(--r-md);padding:9px 12px;
    font-family:inherit;font-size:13.5px;color:var(--ink-2);cursor:pointer;
    margin-bottom:6px;transition:border-color var(--dur-fast) ease-out,
      transform var(--dur-fast) ease-out, box-shadow var(--dur-fast) ease-out}
  .tbtn small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
  .tbtn:hover{border-color:var(--line-strong);transform:translateY(-1px);box-shadow:var(--sh-1)}
  .tbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
  .tbtn.on small{color:var(--accent-dark)}

  .bar{height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);
    transition:width var(--dur-base) var(--ease)}
  .bartx{display:block;margin-top:6px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}

  .metrics{display:block;margin:0}
  .m{display:flex;align-items:baseline;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line-2)}
  .m:last-child{border-bottom:none}
  .m b{font-family:var(--mono);font-size:20px;font-weight:600;line-height:1;
    font-variant-numeric:tabular-nums;color:var(--ink)}
  .m span{font-size:11.5px;color:var(--muted)}
  .m.ok b{color:var(--mach)}
  .m.ai b{color:var(--accent)}
  .m.hd b{color:var(--hand)}
  .m.hm b{color:var(--human)}

  .legend{display:block;margin:0}
  .legend span{display:flex;align-items:center;gap:7px;font-size:11.5px;
    color:var(--muted);margin-bottom:6px}
  .legend i{display:inline-block;width:14px;height:8px;border-radius:2px;flex:none}
  .lg-ai{background:var(--mach)}
  .lg-hm{background:var(--human)}
  .legend .ln{display:inline-block;width:14px;height:0;border-top:2px solid var(--hand);flex:none}

  .prob{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:12px 14px;margin-bottom:14px;box-shadow:var(--sh-1)}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);
    background:var(--surface-3);border:1px solid var(--line);border-radius:999px;padding:3px 11px}
  .prob details summary{font-size:12px;color:var(--muted);cursor:pointer;margin-top:8px}
  .prob details div{font-size:12.5px;color:var(--ink-2);margin-top:6px}

  .flowbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:12px 8px 8px;margin-bottom:14px;overflow-x:auto;box-shadow:var(--sh-1)}
  svg.flow{display:block;width:100%;height:auto;margin:0 auto}
  svg.flow [data-no]{transition:opacity var(--dur-fast) ease-out}
  svg.flow [data-no]:hover{opacity:.88}

  .detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:16px;margin-bottom:14px;min-height:110px;box-shadow:var(--sh-1)}
  .detail > *{animation:rise var(--dur-base) var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .empty{color:var(--muted);font-size:13px;padding:10px 0}
  .dhead{display:flex;align-items:flex-start;gap:11px;margin-bottom:12px}
  .dhead .no{width:26px;height:26px;flex:none;border-radius:var(--r-sm);background:var(--ink);
    color:#fff;font-family:var(--mono);font-size:12px;font-weight:600;
    display:flex;align-items:center;justify-content:center}
  .dhead .tt{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
  .ghint{font-size:12px;color:var(--muted);margin-top:1px}
  .autoTag{font-family:var(--mono);font-size:11px;font-weight:600;white-space:nowrap;
    padding:2px 8px;border-radius:999px;border:1px solid currentColor}
  .dhead .hh{margin-left:auto;flex:none}
  .talk p{font-size:13.5px;color:var(--ink-2);margin:9px 0;line-height:1.75}
  .talk p b{color:var(--ink);font-weight:600}
  .talk p:first-child{margin-top:0}
  .dlist{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;margin-top:4px}
  @media(max-width:760px){.dlist{grid-template-columns:1fr}}
  .drow{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line-2);font-size:13px}
  .drow:last-child{border-bottom:none}
  .drow .k{flex:none;width:58px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .drow .v{flex:1;color:var(--ink-2);min-width:0}
  .drow .v.warn{color:var(--alert)}
  .drow.wide{grid-column:1/-1}

  .btn{background:var(--accent);color:#fff;border:1px solid var(--accent);
    border-radius:var(--r-md);padding:9px 16px;font-family:inherit;font-size:13px;font-weight:600;
    cursor:pointer;min-height:38px;
    transition:background var(--dur-fast) ease-out, transform var(--dur-fast) ease-out,
      box-shadow var(--dur-fast) ease-out}
  .btn:hover{background:var(--accent-dark);transform:translateY(-1px);box-shadow:var(--sh-2)}
  .btn:active{transform:translateY(0)}
  .btn.g{background:var(--surface);color:var(--ink-2);border-color:var(--line);font-weight:500}
  .btn.g:hover{background:var(--surface-2);border-color:var(--line-strong)}
  .mini{background:var(--surface);color:var(--ink-2);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:6px 11px;font-family:inherit;font-size:12px;
    cursor:pointer;min-height:32px;max-width:100%;white-space:normal;text-align:left;
    transition:border-color var(--dur-fast) ease-out, background var(--dur-fast) ease-out,
      transform var(--dur-fast) ease-out}
  .mini:hover{border-color:var(--accent);color:var(--accent-dark);transform:translateY(-1px)}
  .acts{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:12px}

  .link{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:16px;margin-bottom:14px;box-shadow:var(--sh-1)}
  .link h4{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .link h4 span{font-family:var(--mono);font-size:11.5px;font-weight:400;color:var(--muted);
    margin-left:8px;letter-spacing:0}
  .sub{font-size:12.5px;color:var(--muted);margin:4px 0 10px}
  textarea{width:100%;min-height:104px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:var(--r-md);padding:11px 13px;font-family:var(--sans);font-size:13px;
    line-height:1.7;color:var(--ink);resize:vertical;
    transition:border-color var(--dur-fast) ease-out, box-shadow var(--dur-fast) ease-out}
  textarea::placeholder{color:var(--muted)}
  textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .pipe{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin:10px 0}
  .pbox{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);
    padding:8px 11px;font-size:12.5px;color:var(--ink-2)}
  .pbox b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
    color:var(--muted);font-weight:600;margin-bottom:2px}
  .parw{color:var(--muted);align-self:center;font-family:var(--mono)}
  .pill{display:inline-block;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);
    background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r-sm);padding:1px 7px}
  .scmeta{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.7}
  .scmod{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;
    margin-top:10px;background:var(--surface-2)}
  .scmod>b{font-size:13px;font-weight:600}
  .scmod .ok{font-family:var(--mono);font-size:11.5px;color:var(--human);margin-left:9px}
  .scmod .warn{font-family:var(--mono);font-size:11.5px;color:var(--alert);margin-left:9px}
  .scit{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line-2);
    font-size:12.5px;color:var(--ink-2)}
  .scit .lv{display:inline-block;font-family:var(--mono);font-size:11px;border-radius:var(--r-sm);
    padding:1px 7px;background:var(--surface-3);color:var(--ink-2)}
  .scit .lv-需修改{background:var(--alert-soft);color:var(--alert);border:1px solid var(--alert-line)}
  .scit .lv-缺项{background:var(--accent-soft);color:var(--accent-dark);border:1px solid var(--mach-line)}
  .scit .lv-需核对{background:var(--hand-soft);color:var(--hand);border:1px solid var(--hand-line)}
  .scit .ln{font-family:var(--mono);color:var(--muted);margin-left:8px;font-size:11px}
  .scit .tx{margin-top:5px;color:var(--ink)}
  .scit .is{margin-top:3px}
  .scit .sg{margin-top:3px;color:var(--muted)}

  .llmbar{display:flex;gap:10px;align-items:center;margin-top:12px}
  .llmstate{font-size:11.5px;color:var(--muted)}
  .llmsetup{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
  .llmsetup input{flex:1;min-width:220px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:var(--r-md);padding:8px 11px;font-family:var(--sans);font-size:12.5px;
    color:var(--ink);transition:border-color var(--dur-fast) ease-out}
  .llmsetup input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .llmout{font-size:12.5px;line-height:1.75;color:var(--ink-2);
    background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--hand);
    border-radius:var(--r-md);padding:4px 13px 9px;margin-top:10px}
  .llmraw{white-space:pre-wrap;padding:7px 0}
  /* 等待动画：三点跳动 ＋ 一条来回跑的进度条。
     原来是静态文字，别人用会以为卡死了。 */
  @keyframes ldpulse{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
  @keyframes ldslide{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}
  .ld{padding:10px 0 2px}
  .ld .t{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;color:var(--muted)}
  .ld .t i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:ldpulse 1.05s infinite}
  .ld .t i:nth-child(2){animation-delay:.17s}
  .ld .t i:nth-child(3){animation-delay:.34s}
  .ld .t b{font-weight:600}
  .ld .ldbar{height:3px;border-radius:2px;background:var(--line-2);overflow:hidden;margin-top:8px;max-width:340px}
  .ld .ldbar i{display:block;height:100%;width:30%;background:var(--ai);animation:ldslide 1.35s ease-in-out infinite}
  /* 全程跑的进度条与「停下」按钮 */
  .job{padding:11px 13px;border-radius:var(--r-md);background:#f6f8fc;border:1px solid var(--line);
    margin:7px 0 13px}
  .job .top{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2)}
  .job .top b{color:var(--ink)}
  .job .track{height:4px;border-radius:2px;background:var(--line-2);overflow:hidden;margin-top:9px}
  .job .track i{display:block;height:100%;background:var(--ai);transition:width .35s ease-out}
  .job .act{margin-left:auto;display:flex;gap:7px}
  .job.stop{border-color:#e6c9a8;background:#fdf7ee}
  .llmnone,.llmok{padding:9px 0;color:var(--muted)}
  /* 打标结果是一张表。渲染成真表格，别让它散成一坨等宽文字。 */
  .tagwrap{overflow-x:auto;margin-top:10px;border:1px solid var(--line);
    border-radius:var(--r-md);background:var(--surface-2)}
  .tagwrap table{border-collapse:collapse;font-size:12px;line-height:1.6;min-width:100%}
  .tagwrap th{background:var(--surface-3,rgba(0,0,0,.03));color:var(--ink);
    font-weight:600;text-align:left;padding:7px 10px;white-space:nowrap;
    border-bottom:1px solid var(--line)}
  .tagwrap td{padding:7px 10px;border-bottom:1px solid var(--line-soft,rgba(0,0,0,.05));
    color:var(--ink-2);vertical-align:top}
  .tagwrap tr:last-child td{border-bottom:none}
  .tagwrap td.low{color:#b4622a;font-weight:600}
  .tagtail{white-space:pre-wrap;font-size:12.5px;color:var(--ink-2);
    background:#fdf7ec;border:1px solid #ecdfc4;border-radius:var(--r-md);
    padding:9px 12px;margin-top:10px}
  .tagstep{font-size:12.5px;font-weight:600;color:var(--ink);margin-top:14px;
    padding-bottom:5px;border-bottom:1px solid var(--line)}
  .tagstep span{font-weight:400;color:var(--muted)}
  .llmok{color:var(--human)}
  .llmit{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line-2)}
  .llmit:last-child{border-bottom:none}
  .llmit .n{flex:none;width:20px;height:20px;border-radius:var(--r-sm);background:var(--hand-soft);
    color:var(--hand);font-family:var(--mono);font-size:11px;font-weight:600;
    display:flex;align-items:center;justify-content:center;margin-top:1px}
  .llmit .bd{flex:1;min-width:0}
  .llmit .q{font-size:12px;color:var(--muted);border-left:2px solid var(--hand-line);
    padding-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .llmit .p{font-size:13px;color:var(--ink-2);margin-top:4px}
  .llmit .f{font-size:13px;color:var(--ink);margin-top:5px;padding:6px 9px;border-radius:var(--r-sm);
    background:var(--ai-soft,#eef4ff);border-left:2px solid var(--ai)}
  .llmit .f .k{font-size:11.5px;color:var(--ai);font-weight:600;margin-right:6px}
  .llmit .q .qshort em{font-style:normal;color:var(--ai);margin-left:4px;font-size:11.5px}
  .llmit .q .qfull{display:none}
  .llmit .q.open .qfull{display:inline}
  .llmit .q.open .qshort{display:none}

  .panel2{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:16px;margin-bottom:14px;box-shadow:var(--sh-1)}
  .panel2 h4{font-size:15px;font-weight:600;letter-spacing:-.01em;margin-bottom:8px}
  .trg div{font-size:12.5px;background:var(--alert-soft);border:1px solid var(--alert-line);
    color:var(--alert);border-radius:var(--r-md);padding:8px 11px;margin-top:7px}
  details.ref{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:12px 16px;box-shadow:var(--sh-1)}
  details.ref summary{font-family:var(--mono);font-size:11.5px;color:var(--muted);cursor:pointer;
    list-style:none}
  details.ref summary::-webkit-details-marker{display:none}
  details.ref summary::before{content:"+ ";color:var(--accent)}
  details.ref[open] summary::before{content:"− "}
  .reftxt{font-size:12.5px;color:var(--ink-2);line-height:1.85;margin-top:10px;
    padding-top:10px;border-top:1px dashed var(--line-2)}
  .reftxt b{color:var(--ink)}

  footer{margin-top:16px;font-size:11.5px;color:var(--muted);line-height:1.8}

  @media(max-width:880px){
    .layout{grid-template-columns:1fr}
    /* 窄屏：保持单列（两列会把标签和内容拆散），改为压紧间距并隐去冗余图例
       —— 泳道图上已直接写着机器/人，图例在窄屏是重复信息 */
    .side{position:static;max-height:none}
    .side h2{margin:11px 0 5px}
    .metrics .m{padding:4px 0}
    .tbtn{margin-bottom:5px}
    .legend,.side h2:nth-of-type(4){display:none}
  }
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

  /* 拖文件进来时的整页提示 */
  body.dragging::after{
    content:"把稿子放进来，自动开跑";
    position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;
    background:rgba(180,83,9,.06);border:2px dashed var(--accent);border-radius:var(--r-lg);
    font-family:var(--mono);font-size:14px;color:var(--accent-dark);pointer-events:none}

  /* 动效降级：系统设为减少动效时，全部关掉 */
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }

  @media(prefers-reduced-motion:no-preference){
    /* 一次编排好的入场序列：左栏 5 组、右栏 5 组，错峰 70ms */
    .side h2,.side .switch,.side .bar,.side .metrics,.side .legend,
    .maincol > *{ animation:rise var(--dur-base) var(--ease) both; }
    .side h2{animation-delay:0ms}
    .side .switch{animation-delay:70ms}
    .side .bar{animation-delay:140ms}
    .side .metrics{animation-delay:210ms}
    .side .legend{animation-delay:280ms}
    .maincol > *:nth-child(1){animation-delay:120ms}
    .maincol > *:nth-child(2){animation-delay:190ms}
    .maincol > *:nth-child(3){animation-delay:260ms}

function render(id){
  cur = id; sel = 1;

  var lead = 0, follow = 0, ho = 0;
  for (var k=0;k<t.steps.length;k++){
    if (machineLead(t.steps[k])) lead++; else follow++;
    if (t.steps[k].handoff.indexOf('→') > -1) ho++;
  }
  var noPerson = 0;
  for (var q2 = 0; q2 < t.steps.length; q2++) {
    var a2 = t.steps[q2].auto;
    if (a2 === '全自动' || a2 === '例外制') noPerson++;
  }

    '<div class="m"><b>'+t.steps.length+'</b><span>步流程</span></div>' +
    '<div class="m ok"><b>'+noPerson+'</b><span>步不用人盯</span></div>' +
    '<div class="m hd"><b>'+(t.steps.length - noPerson)+'</b><span>步要人出手</span></div>' +
    '<div class="m ai"><b>'+ho+'</b><span>处交接点</span></div>';

  T('prob').innerHTML =
    '<div class="chips" style="margin:0">' +
    '<span class="chip">'+esc(t.maps_to)+'</span>' +

    '<div style="font-size:12.5px;color:#465063;line-height:1.7;margin-top:5px">' +
    esc(t.current) + '<br>' + esc(t.bottleneck) + '</div></details>';

  drawFlow(t);
  renderDetail(t);
  renderLink(t);
  upProg(t);
}

/* ============ 流程图（SVG） ============ */
function drawFlow(t){
  /* 列宽固定、总宽按步数算。原先写死 860 再按步数均分，
     8 步时卡片只有 74.5px，放不下 7 个中文字，标题会溢出卡片压到隔壁。 */
  var LBL = 78, PAD = 12, COLW = 150, LH = 124, LGAP = 40;
  var n = t.steps.length;
  var W = LBL + n * COLW + 10;
  var colW = COLW;
  var bw = COLW - 22, bh = 92;
  /* 每行能放几个中文字，按卡片实际可用宽度算（字号 12.5，左右各留 10 内边距） */
  var per = Math.max(4, Math.floor((bw - 20) / 13));
  var y0 = PAD, y1 = PAD + LH + LGAP, H = y1 + LH + 26;
  var rowC = { "机器": y0 + LH / 2, "人": y1 + LH / 2 };
  var s = [];
  s.push('<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">' +
         '<path d="M0,0 L10,5 L0,10 z" fill="' + tok("hand") + '"/></marker></defs>');

  s.push('<rect x="' + (LBL - 6) + '" y="' + y0 + '" width="' + (W - LBL + 6) + '" height="' + LH + '" rx="10" fill="' + tok("machSoft") + '" stroke="' + tok("machLine") + '" stroke-width="0.5"/>');
  s.push('<rect x="' + (LBL - 6) + '" y="' + y1 + '" width="' + (W - LBL + 6) + '" height="' + LH + '" rx="10" fill="' + tok("humanSoft") + '" stroke="' + tok("humanLine") + '" stroke-width="0.5"/>');
  s.push('<rect x="' + (LBL - 62) + '" y="' + (rowC["机器"] - 9) + '" width="3" height="18" rx="1.5" fill="' + tok("mach") + '"/>');
  s.push('<text x="' + (LBL - 18) + '" y="' + (rowC["机器"] + 6) + '" text-anchor="end" font-size="15.5" font-weight="600" fill="' + tok("mach") + '">机器</text>');
  s.push('<rect x="' + (LBL - 62) + '" y="' + (rowC["人"] - 9) + '" width="3" height="18" rx="1.5" fill="' + tok("human") + '"/>');
  s.push('<text x="' + (LBL - 18) + '" y="' + (rowC["人"] + 6) + '" text-anchor="end" font-size="15.5" font-weight="600" fill="' + tok("human") + '">人</text>');

  for (var i = 0; i < n; i++) {
    var st = t.steps[i];
    var cx = LBL + colW * i + colW / 2;
    var lane = st.raci.R;
    var other = (lane === "机器") ? "人" : "机器";
    var by = rowC[lane] - bh / 2;
    var bx = cx - bw / 2;
    var d = done[key(st.no)];
    var accent = (lane === "机器") ? tok("mach") : tok("human");
    var sel2 = (sel === st.no);

    s.push('<rect x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" rx="9" fill="' +
           (d ? tok("humanSoft") : "#ffffff") + '" stroke="' + (sel2 ? accent : tok("line")) + '" stroke-width="' +
           (sel2 ? 2 : 1) + '"/>');
    s.push('<text x="' + (bx + 10) + '" y="' + (by + 18) + '" font-size="11" fill="' + tok("muted") + '">第 ' + st.no + ' 步</text>');
    s.push('<text x="' + (bx + bw - 10) + '" y="' + (by + 18) + '" text-anchor="end" font-size="11" fill="' + accent + '">R ' + esc(lane) + '</text>');
    /* 三行各自的 y 必须错开：原先标题第二行在 by+56、底部小字在 by+54，同位置叠成一团 */
    var acol = AUTO_COLOR[st.auto] || tok('muted');
    s.push('<text x="' + (bx + 10) + '" y="' + (by + bh - 10) + '" font-size="10.5" fill="' + acol + '">' + esc(autoText(st.auto)) + '</text>');
    var wl = wrap2(st.title, per);
    s.push('<text x="' + (bx + 10) + '" y="' + (by + 43) + '" font-size="12.5" font-weight="600" fill="' + tok("ink") + '">' + esc(wl[0]) + '</text>');
    if (wl[1]) s.push('<text x="' + (bx + 10) + '" y="' + (by + 61) + '" font-size="12.5" font-weight="600" fill="' + tok("ink") + '">' + esc(wl[1]) + '</text>');
    if (d) s.push('<text x="' + (bx + bw - 10) + '" y="' + (by + bh - 10) + '" text-anchor="end" font-size="10.5" fill="' + tok("human") + '">已完成</text>');

    var chipTxt = (st.auto === '全自动') ? '' : (st.auto === '例外制' ? '例外' : st.raci.other);
    if (chipTxt) {
      /* 介入标签放在两条泳道之间的专用带里，按介入方取色：
         框在机器泳道、标签是青色＝这一步人来介入；反之亦然 */
      var chipH = 21, chipW = Math.min(Math.max(52, chipTxt.length * 12 + 22), COLW - 12);
      var chipY = y0 + LH + (LGAP - chipH) / 2;
      var chipX = cx - chipW / 2;
      var ly1 = (lane === "机器") ? (by + bh) : (chipY + chipH);
      var ly2 = (lane === "机器") ? chipY : by;
      var cSoft = (other === "人") ? tok("humanSoft") : tok("machSoft");
      var cLine = (other === "人") ? tok("humanLine") : tok("machLine");
      var cInk = (other === "人") ? tok("human") : tok("mach");
      s.push('<line x1="' + cx + '" y1="' + ly1 + '" x2="' + cx + '" y2="' + ly2 +
             '" stroke="' + cLine + '" stroke-width="1" stroke-dasharray="3 3"/>');
      s.push('<rect x="' + chipX + '" y="' + chipY + '" width="' + chipW + '" height="' + chipH +
             '" rx="11" fill="' + cSoft + '" stroke="' + cLine + '" stroke-width="0.5"/>');
      s.push('<text x="' + cx + '" y="' + (chipY + 14.5) + '" text-anchor="middle" font-size="12" font-weight="600" fill="' + cInk + '">' + esc(chipTxt) + '</text>');
    }

    s.push('<rect data-no="' + st.no + '" x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh +
           '" fill="transparent" style="cursor:pointer"/>');

    if (i < n - 1) {
      var nx = t.steps[i + 1];
      var x1 = bx + bw, yA = rowC[lane];
      var bx2 = LBL + colW * (i + 1) + colW / 2 - bw / 2;
      var x2 = bx2, yB = rowC[nx.raci.R];
      if (Math.abs(yA - yB) < 1) {
        s.push('<line x1="' + x1 + '" y1="' + yA + '" x2="' + (x2 - 2) + '" y2="' + yB +
               '" stroke="' + tok("hand") + '" stroke-width="1.5" marker-end="url(#ar)"/>');
      } else {
        var mid = x1 + (colW - bw) / 2;
        s.push('<path d="M' + x1 + ',' + yA + ' L' + mid + ',' + yA + ' L' + mid + ',' + yB +
               ' L' + (x2 - 2) + ',' + yB + '" fill="none" stroke="' + tok("hand") + '" stroke-width="1.5" marker-end="url(#ar)"/>');
      }
    }
  }

  s.push('<text x="' + (LBL - 6) + '" y="' + (H - 6) + '" font-size="11" fill="' + tok("muted") + '">跨泳道箭头＝交接点。点任意一步看细节。</text>');
  var svg = T('flow');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  /* 最多按原尺寸显示：容器更宽也不拉伸放大（原先 width:100% 会把图拉大，字跟着变粗，更容易溢出） */
  svg.style.maxWidth = W + 'px';
  svg.innerHTML = s.join('');
  var hits = svg.querySelectorAll('[data-no]');
  for (var q = 0; q < hits.length; q++) {
    hits[q].addEventListener('click', function(){ selectStep(parseInt(this.getAttribute('data-no'), 10)); });
  }
}

/* 把标题切成最多两行。硬按字数切会切出「…判断」只剩一个字这种行，也不管词：
   ① 第二行只剩一个字时，从第一行挪一个字过来
   ② 切点前三个字里有连词或标点时，切到它后面，尽量不断词
   ③ 挪完第二行放不下就不挪，宁可硬切 */
function wrap2(s, per){
  if (s.length <= per) return [s];
  var a = per;
  if (s.length - a === 1 && a > 2) a = per - 1;
  var CONJ = "与和及、，：；";
  for (var q = a - 1; q >= Math.max(2, a - 3); q--) {
    if (CONJ.indexOf(s.charAt(q)) > -1) {
      if (s.length - (q + 1) <= per) a = q + 1;
      break;
    }
  }
  var second = s.slice(a);
  return [s.slice(0, a), second + (s.length - a > per ? '…' : '')];
}

function selectStep(no){
  sel = no; drawFlow(task(cur)); renderDetail(task(cur));
  var el = T('detail');
  if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

var moreOpen = false;
var MORE_LABEL = '还有：怎么交接、机器要什么、你拍什么板、出错怎么办、凭什么这么分';

function upProg(t){

  var x = T('barTx'); if (x) x.textContent = n + ' / ' + t.steps.length + ' 步已完成';

/* ============ 交付前自检（引擎内嵌，页面直接跑） ============ */
function gr(){ return DATA.meta.check_engine.global_rules; }
function typeSpec(k){ return DATA.meta.check_engine.types[k] || null; }
function hasAny(line, arr){
  for (var i = 0; i < arr.length; i++) { if (line.indexOf(arr[i]) > -1) return true; }
  return false;
}

/* A 数字与出处：数字带单位，但同行既无来源标记也无待验证标记 */
function checkA(lines, on){
  var out = [];
  if (!on) return out;
  var re = new RegExp('[0-9]+(?:\\.[0-9]+)?\\s*' + gr().unit_pattern, 'g');
  for (var i = 0; i < lines.length; i++) {
    var nums = lines[i].match(re);
    if (!nums || !nums.length) continue;
    if (hasAny(lines[i], gr().source_markers) || hasAny(lines[i], gr().uncertain_markers)) continue;
    out.push({ level: '待确认', line: i + 1, text: lines[i].trim().slice(0, 90),
      issue: '出现数字 ' + nums.slice(0, 3).join('、') + '，但没有来源标注，也没有标注为待验证',
      suggest: '补来源（官方公告／后台数据／第三方估算），或标注为待验证' });
  }
  return out;
}

/* B 禁用表述与套话 */
function checkB(lines, spec, on){
  var out = [];
  if (!on || !spec) return out;
  var fo = spec.forbidden_wording || [], so = spec.soft_wording || [];
  for (var i = 0; i < lines.length; i++) {
    for (var a = 0; a < fo.length; a++) {
      if (lines[i].indexOf(fo[a]) > -1) out.push({ level: '需修改', line: i + 1, text: lines[i].trim().slice(0, 90),
        issue: '出现禁用表述「' + fo[a] + '」', suggest: '改为可核实的客观描述，避免绝对化与承诺性表述' });
    }
    for (var b = 0; b < so.length; b++) {
      if (lines[i].indexOf(so[b]) > -1) out.push({ level: '建议', line: i + 1, text: lines[i].trim().slice(0, 90),
        issue: '出现空泛表述「' + so[b] + '」', suggest: '换成具体信息，例如具体数值、具体变化或具体要求' });
    }
  }
  return out;
}

/* C 必含栏目覆盖 */
function checkC(lines, spec, on){
  var out = [];
  if (!on || !spec) return out;
  var text = lines.join('\n'), req = spec.required_sections || [];
  for (var i = 0; i < req.length; i++) {
    if (text.indexOf(req[i]) > -1) continue;
    out.push({ level: '缺项', line: '-', text: req[i],
      issue: '该类型交付物要求的栏目「' + req[i] + '」在文件中未出现',
      suggest: '补上这一栏；若本单确实不涉及，补一句说明为什么不涉及' });
  }
  return out;
}

/* D 同一指标多值（含名称归一化：短名若是长名的子串，归到最长那个） */
function checkD(lines, on){
  var out = [];
  if (!on) return out;
  var re = new RegExp('([\\u4e00-\\u9fff]{2,8})(?:为|是|：|:)\\s*([0-9]+(?:\\.[0-9]+)?\\s*' + gr().unit_pattern + ')', 'g');
  var bucket = {};
  for (var i = 0; i < lines.length; i++) {
    re.lastIndex = 0;
    var mm;
    while ((mm = re.exec(lines[i])) !== null) {
      var k = mm[1], v = mm[2].replace(/\s/g, '');
      if (!bucket[k]) bucket[k] = [];
      bucket[k].push({ line: i + 1, val: v });
    }
  }
  var keys = Object.keys(bucket), merged = {};
  for (var j = 0; j < keys.length; j++) {
    var cur = keys[j], cands = [];
    for (var q = 0; q < keys.length; q++) {
      if (keys[q] !== cur && keys[q].indexOf(cur) > -1) cands.push(keys[q]);
    }
    var canon = cur;
    for (var w = 0; w < cands.length; w++) { if (cands[w].length > canon.length) canon = cands[w]; }
    if (!merged[canon]) merged[canon] = [];
    merged[canon] = merged[canon].concat(bucket[cur]);
  }
  for (var ck2 in merged) {
    var vals = [], seen = {};
    for (var z = 0; z < merged[ck2].length; z++) {
      var vv = merged[ck2][z].val;
      if (!seen[vv]) { seen[vv] = 1; vals.push(vv); }
    }
    if (vals.length < 2) continue;
    var ln = [];
    for (var y = 0; y < merged[ck2].length; y++) ln.push(merged[ck2][y].line);
    out.push({ level: '需核对', line: ln.join('、'), text: ck2 + ' -> ' + vals.join('、'),
      issue: '「' + ck2 + '」在文中出现了多个不同数值',
      suggest: '确认哪个为准；如果是不同口径，需在文中分别写明口径' });
  }
  return out;
}

/* E 引用可查性 */
function checkE(lines, on){
  var out = [];
  if (!on) return out;
  var re = /["“']([^”"']{6,60})[”"']/g;
  for (var i = 0; i < lines.length; i++) {
    re.lastIndex = 0;
    var ms = lines[i].match(re);
    if (!ms || !ms.length) continue;
    if (hasAny(lines[i], gr().source_markers)) continue;
    var first = ms[0].replace(/["“'”]/g, '');
    out.push({ level: '待确认', line: i + 1, text: lines[i].trim().slice(0, 90),
      issue: '引用了「' + first.slice(0, 30) + '」，但同一行没有来源标注',
      suggest: '补出处（平台／帖子／公告名或链接），确保能被查证' });
  }
  return out;
}

/* F 列举检查 —— 「N 条」与后面列出的项数是否对得上。
   加它的理由：实测里同一类错出现过两次（写「共 4 条」却列 5 个），
   而 A 查数字出处、D 查同一指标多值，都拦不住它。
   逻辑与 运营自检/F_enum_count_check.py 一一对应，两边结果必须一样（冒烟测试会比对）。 */
function checkF(lines, on){
  var out = [];
  if (!on) return out;
  var CNT = /(\d+)\s*条/;
  var LEAD = ['包括', '如下', '分别是', '分别为'];
  var TAIL = /(\d+)\s*条[^。！？\n]{0,22}[：:]\s*$/;
  var BUL = /^\s*(?:[-*·]|\d+[.、)])\s+\S/;
  var INNER = /\d+\s*条/;
  function plain(s){ return String(s).replace(/\*\*/g, '').replace(/__/g, ''); }
  function leadPos(s){
    var best = -1;
    for (var q = 0; q < LEAD.length; q++) {
      var p = s.indexOf(LEAD[q]);
      if (p > -1 && (best < 0 || p < best)) best = p;
    }
    return best;
  }
  function countItems(seg){
    var c = seg.split('序号').length - 1;
    if (c >= 2) return c;
    var parts = seg.split(/[、，,；;]/), n = 0;
    for (var q = 0; q < parts.length; q++) { if (parts[q].trim()) n++; }
    return n;
  }
  var i, j;
  // 模式一：同一行「N 条 … 包括：A、B、C」
  for (i = 0; i < lines.length; i++) {
    var cl = plain(lines[i]);
    var m = cl.match(CNT);
    if (!m) continue;
    var tail = cl.slice(cl.indexOf(m[0]) + m[0].length);
    var pos = leadPos(tail);
    if (pos < 0) continue;
    var n0 = parseInt(m[1], 10);
    var seg = tail.slice(pos).split('。')[0];
    for (var w = 0; w < LEAD.length; w++) {
      if (seg.indexOf(LEAD[w]) === 0) { seg = seg.slice(LEAD[w].length); break; }
    }
    seg = seg.replace(/^[：:，, ]+/, '');
    if (INNER.test(seg)) continue;            // 分类明细，不是逐条列举
    var c0 = countItems(seg);
    if (c0 >= 2 && c0 !== n0) {
      out.push({ level: '待确认', line: i + 1, text: lines[i].trim().slice(0, 90),
        issue: '这一行写「' + n0 + ' 条」，按后面列出的项算是 ' + c0 + ' 项，两个数对不上',
        suggest: '数一遍，把数字改对；或者把多出来／少掉的条目补齐' });
    }
  }
  // 模式二：一行以「N 条…：」收尾，下面跟两个以上列表项
  for (j = 0; j < lines.length; j++) {
    var cl2 = plain(lines[j]);
    var m2 = cl2.match(TAIL);
    if (!m2) continue;
    var n1 = parseInt(m2[1], 10), k = j + 1, items = [];
    while (k < lines.length && BUL.test(lines[k])) { items.push(lines[k]); k++; }
    if (items.length < 2) continue;
    var inner = false;
    for (var q2 = 0; q2 < items.length; q2++) { if (INNER.test(plain(items[q2]))) inner = true; }
    if (inner) continue;
    if (items.length !== n1) {
      out.push({ level: '待确认', line: j + 1, text: lines[j].trim().slice(0, 90),
        issue: '这一行写「' + n1 + ' 条」，下面列了 ' + items.length + ' 个条目，两个数对不上',
        suggest: '数一遍，把数字改对；或者把多出来／少掉的条目补齐' });
    }
  }
  return out;
}


function runModules(text, typeKey){
  var lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  var spec = typeSpec(typeKey), mods = modulesOf(typeKey);
  var has = function(k){ return mods.indexOf(k) > -1; };
  return [
    { k: 'A', name: 'A 数据检查 — 数字与出处', items: checkA(lines, has('A')) },
    { k: 'B', name: 'B 表述检查 — 禁用表述与套话', items: checkB(lines, spec, has('B')) },
    { k: 'C', name: 'C 结构检查 — 栏目覆盖', items: checkC(lines, spec, has('C')) },
    { k: 'D', name: 'D 一致性检查 — 内部前后矛盾', items: checkD(lines, has('D')) },

    { k: 'F', name: 'F 列举检查 — 数量与枚举是否对得上', items: checkF(lines, has('F')) }
  ];
}

var MOD_SHORT = { "A": "数字出处", "B": "禁用表述", "C": "栏目齐全", "D": "前后一致", "E": "引用可查", "F": "数量与枚举" };

var LLM_DEF = { url: 'https://apihub.agnes-ai.com/v1/chat/completions', model: 'agnes-3.0-flash' };

/* 随页面一起走的访问凭据。
   明文不写在这里，改成编码后的一串数字，运行时拼回来。
   这样在源码里搜不到连续的密钥串，功能不受影响。
   换自己的凭据：python 注入密钥.py */
var LLM_KEY_ENC = [];
var LLM_KEY_SALT = 137;
function llmUnwrap(){
  if (!LLM_KEY_ENC || !LLM_KEY_ENC.length) return '';
  var s = '', i;
  for (i = 0; i < LLM_KEY_ENC.length; i++) {
    var v = LLM_KEY_ENC[i] ^ ((LLM_KEY_SALT + i * 29) & 255);
    if (v <= 0) break;
    s += String.fromCharCode(v);
  }
  return s;
}
function llmCfg(){
  return {
    url: LLM_DEF.url,
    key: llmUnwrap(),
    model: T('llm_model') && T('llm_model').value ? T('llm_model').value.trim() : LLM_DEF.model
  };
}
function llmModel(){
  try { return localStorage.getItem('llm_model') || llmCfg().model; } catch (e) { return LLM_DEF.model; }
}
function llmShowSetup(){
  var s = T('llm_setup');
  if (s) s.style.display = 'flex';
}
function llmHide(){ var s = T('llm_setup'); if (s) s.style.display = 'none'; }
function llmGo(){ callLlm(); }

/* 大模型回的是一段编号文本，直接倒出来是一堵墙。
   这里拆成条目：编号 + 原文片段（截断、悬停看全）+ 问题。 */
/* 一键跑完：把原本要点五次的事串成一次。
   只自动勾「交付前自检」这一步——因为确实是工具做的；
   其余步骤机器只是"假定你在别处做了"，代勾会失真。 */
function runAll(){
  var t = task(cur), draft = T('draft').value;
  if (!draft.trim()) { T('sc_sum').textContent = '先把初稿粘上，或把文件拖进来'; return; }
  runSelfCheck();
  if (llmCfg().key) { callLlm(); }
  else {
    var o = T('llm_out');
    o.style.display = 'block';
    o.innerHTML = '<div class="llmnone">规则检查已经跑完，AI 这一步跳过（文件里没有可用的访问凭据）。</div>';
  }
  var ticked = 0;
  for (var i = 0; i < t.steps.length; i++) {
    if (t.steps[i].title.indexOf('自检') > -1 && !done[key(t.steps[i].no)]) {
      done[key(t.steps[i].no)] = true; ticked++;
    }
  }
  if (ticked) { drawFlow(t); renderDetail(t); upProg(t); saveState(); }
  toast('跑完了，往下可以导出流程单');
}

function renderLlm(txt){
  var raw = String(txt || '').trim();
  if (!raw) return '<div class="llmnone">模型没有返回内容。</div>';
  var items = parseLlm(raw);
  LLM_ITEMS = items;
  if (!items.length) return '<div class="llmnone">模型没有给出意见。</div>';
  if (items.length === 1 && /^(无|沒有|没有)(。|\.)?$/.test(items[0].p)) {
    return '<div class="llmok">这一遍没提出语义层问题。</div>' +
      '<div class="llmnone">AI 这一层是启发式的：同一个问题，多跑一次结果可能不同。它没提，不等于真没有。</div>';
  }
  var h = '<div class="llmlist">';
  for (var j = 0; j < items.length; j++) {
    var it = items[j], id = 'q' + j;
    h += '<div class="llmit"><span class="n">' + (j + 1) + '</span><div class="bd">';
    if (it.q) {
      var short = it.q.length > 56 ? it.q.slice(0, 56) + '…' : '';
      h += '<div class="q" id="' + id + '" onclick="togQuote(\'' + id + '\')">' +
           '<span class="qfull">' + esc(it.q) + '</span>' +
           (short ? '<span class="qshort">' + esc(short) + '<em>展开</em></span>' : '') +
           '</div>';
    }
    if (it.p) h += '<div class="p">' + esc(it.p) + '</div>';
    if (it.f) h += '<div class="f"><span class="k">改成</span>' + esc(it.f) + '</div>';
    h += '</div></div>';
  }
  h += '</div>';
  h += '<div class="acts" style="margin-top:10px">' +
       '<button class="btn" onclick="llmRewrite()">按这些改法重写一版</button>' +
       '<span class="llmstate" id="rw_state"></span></div>';
  return h;
}

/* 原文片段太长时默认收起，点一下看全文。 */
function togQuote(id){
  var el = T(id);
  if (!el) return;
  if (el.className.indexOf('open') > -1) el.className = 'q';
  else el.className = 'q open';
}

/* 把模型回的内容解析成「原文 / 问题 / 改法」三段。
   如果它没按格式回，就整段当作「问题」，不丢内容。 */
function parseLlm(raw){
  var lines = String(raw || '').split('\n'), out = [], cur = null;
  for (var i = 0; i < lines.length; i++) {
    var s = lines[i].replace(/^[\s>#*\-]+/, '').replace(/\*\*/g, '').trim();
    if (!s) continue;
    var m1 = s.match(/^(?:条目|原文片段|原文|位置)\s*[：:]\s*(.+)$/);
    var m2 = s.match(/^问题\s*[：:]\s*(.+)$/);
    var m3 = s.match(/^(?:改法|建议改成|建议|改写)\s*[：:]\s*(.+)$/);
    if (m1) { cur = { q: m1[1], p: '', f: '' }; out.push(cur); continue; }
    if (m2 && cur) { cur.p = m2[1]; continue; }
    if (m3 && cur) { cur.f = m3[1]; continue; }
    // 兼容老格式「原文片段 → 问题」
    if (!cur && s.indexOf(' → ') > -1) {
      var pr = s.split(/\s*→\s*/);
      out.push({ q: pr[0].replace(/^原文\s*/, ''), p: pr.slice(1).join(' → '), f: '' });
      continue;
    }
    if (!cur) { cur = { q: '', p: s, f: '' }; out.push(cur); continue; }
    if (!cur.p) cur.p = s;
    else if (!cur.f) cur.f = s;
    else cur.p += ' ' + s;
  }
  return out;
}


function callLlm(){
  var c = llmCfg(), out = T('llm_out');
  if (!c.key) { out.style.display = 'block'; out.innerHTML = '<div class="llmnone">这个文件里没有可用的访问凭据，AI 这一步先跳过。规则检查不受影响。</div>'; return; }
  var t = task(cur), sc = t.selfcheck, draft = T('draft').value;
  out.style.display = 'block';
  if (!draft.trim()) { out.textContent = '先把初稿粘到上面。'; return; }
  var res = runModules(draft, sc.type_key), found = [];
  for (var i = 0; i < res.length; i++) { if (res[i].items.length) found.push(MOD_SHORT[res[i].k] + ' ' + res[i].items.length + ' 项'); }
  var prompt = '你是游戏运营交付物的辅助审稿人。规则检查已经查过格式问题，你只找规则查不到的语义层问题。\n' +
    '最多提 5 条，每条严格按下面三行输出，不要多写一个字：\n' +
    '条目：<原文里的那句话，照抄>\n' +
    '问题：<属于下面四种的哪一种＋一句话说清>\n' +
    '改法：<给一句能直接替换上去的话；只是要删掉就写「删掉这句」>\n' +
    '只在这四种情况下才提：① 结论夸大到数据撑不住；② 对外承诺超过内部实际动作；' +
    '③ 同一件事在多处口径打架；④ 分类标签与问题根因对不上（例如把静态文案缺失写成服务器问题）。\n' +
    '以下情况一律不提：文风措辞、格式排版、你觉得"还能更好"但没错的地方、' +
    '已经写明是示例或占位符的地方、你自己不确定的猜测。\n' +
    '宁少勿滥：没有把握的不要写，真的没有上述四种问题就只回答：无。\n' +
    '不要输出思考过程、推理步骤、自我核对，不要写"让我看看""我再想想"这类话，也不要复述规则。\n' +
    '\n【初稿】\n' + draft.slice(0, 4000) + '\n【规则已发现】' + (found.join('；') || '无');
  out.innerHTML = ld('正在读…');
  fetch(c.url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.key },
    body: JSON.stringify({ model: llmModel(), messages: [{ role: 'user', content: prompt }], temperature: 0 })
  }).then(function(r){ return r.json(); }).then(function(j){
    var txt = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || ('返回不是预期格式：' + JSON.stringify(j).slice(0, 300));
    out.innerHTML = renderLlm(txt);
  }).catch(function(e){
    out.innerHTML = '<div class="llmraw">调用失败：' + esc(e.message) + '。多数是密钥不对，或这台机器连不上该接口。</div>';
  });
}

/* 打标与成文共用一次调用。两者都是"出活"，跟上面那个"查错"是两种用法：
   查错要它挑毛病，所以收着（宁少勿滥）；出活要它干完整，所以给全口径、要求逐条给出。 */
/* 统一的等待提示。带跳动动画与进度条，避免看起来像卡死。 */
function ld(text){
  return '<div class="ld"><span class="t"><i></i><i></i><i></i><b>' + esc(text) + '</b></span>' +
         '<div class="ldbar"><i></i></div></div>';
}

/* ============ 全程跑：把分散的几步串成一条链，带进度，可随时停下 ============
   分步按钮全部保留——复核点是人机分工的落点，不能因为图省事就取消。
   这条链只是把「不想一步步点」的场景接住。 */
var ABORT = null;          // 当前请求的中断器
var JOB = { on: false, i: 0, total: 0, names: [], skip: false };

/* 带中断的调用。与 llmAsk 同路，区别是返回 Promise 并挂 abort 信号。 */
function llmP(prompt, temp){
  var c = llmCfg();
  if (!c.key) return Promise.reject(new Error('这个文件里没有可用的访问凭据'));
  var opt = {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.key },
    body: JSON.stringify({ model: llmModel(), messages: [{ role: 'user', content: prompt }], temperature: temp })
  };
  try { ABORT = new AbortController(); opt.signal = ABORT.signal; } catch (e) { ABORT = null; }
  return fetch(c.url, opt).then(function(r){ return r.json(); }).then(function(j){
    if (j.error) throw new Error(j.error.message || JSON.stringify(j.error).slice(0, 160));
    var txt = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
    if (!txt.trim()) throw new Error('模型没有返回内容');
    return txt;
  });
}

function jobBar(){
  var el = T('job_bar');
  if (!el) return;
  if (!JOB.on) { el.innerHTML = ''; return; }
  var pct = Math.round(JOB.i / JOB.total * 100);
  var cur = JOB.names[JOB.i] || '收尾';
  el.innerHTML = '<div class="job"><div class="top">' +
    '<b>全程跑</b><span>第 ' + (JOB.i + 1) + ' / ' + JOB.total + ' 步　' + esc(cur) + '</span>' +
    '<span class="act"><button class="mini" onclick="stopJob()">停下</button></span></div>' +
    '<div class="track"><i style="width:' + pct + '%"></i></div></div>';
}

function stopJob(){
  if (ABORT) { try { ABORT.abort(); } catch (e) {} ABORT = null; }
  JOB.on = false;
  jobBar();
  toast('已停下。已经跑出来的结果都还在，可以接着往下点。');
}

/* 复核点的两个出口。 */
function jobGo(skip){
  JOB.skip = !!skip;
  JOB.i++;
  jobBar();
  jobRun();
}

/* 全程跑。要跑的步数按任务类型定：整理型多两步。 */
function runPipeline(){
  var t = task(cur), W = aiSpec(t);
  if (JOB.on) { stopJob(); return; }
  var names = [];
  if (W.mode === 'organize') names.push('合并去重', '合并复核', '逐条' + W.conv, '出初稿');
  names.push('规则自检', 'AI 审读');
  JOB = { on: true, i: 0, total: names.length, names: names, skip: false };
  jobBar();
  jobRun();
}

function jobRun(){
  var t = task(cur), W = aiSpec(t), organize = (W.mode === 'organize');
  if (!JOB.on) { jobBar(); return; }
  var step = JOB.names[JOB.i];
  if (step === '合并去重' && organize) return stepMerge();
  if (step === '合并复核' && organize) return stepReview();
  if (step && step.indexOf('逐条') === 0 && organize) return stepTag();
  if (step === '出初稿' && organize) return stepDraft();
  if (step === '规则自检') return stepCheck();
  if (step === 'AI 审读') return stepRead();
  JOB.on = false;
  jobBar();
  toast('全程跑完了，往下可以导出流程单');
}

/* 出错提示写到「出事的那一块」，不要一律丢进整理区——
   「初稿框是空的」这种提示跑到整理区，人得满页找。 */
function stepFail(where, msg, box){
  JOB.on = false;
  jobBar();
  var o = T(box || 'tag_out');
  if (o) o.innerHTML = '<div class="llmraw">' + esc(where) + '没成功：' + esc(msg) + '。已经跑出来的结果都还在，可以单独重跑这一步。</div>';
  toast(where + '停下');
}

function stepMerge(){
  var raw = T('raw') ? T('raw').value : '';
  var out = T('tag_out');
  if (!raw || !raw.trim()) { stepFail('合并去重', '原始材料是空的'); return; }
  if (out) out.innerHTML = ld('第一步　正在合并去重');
  llmP(tagPrompt(1, task(cur)) + raw.slice(0, 8000), 0).then(function(merged){
    TAG_MERGED = merged;
    var o = T('tag_out');
    if (o) o.innerHTML = '<div class="tagstep">第一步　合并去重</div><div class="tagtail">' + esc(merged) + '</div>';
    if (JOB.skip) { JOB.i++; jobBar(); jobRun(); }
    else { /* 停在复核点 */ }
  }).catch(function(e){
    if (e && e.name === 'AbortError') return;
    stepFail('合并去重', e.message || e);
  });
}

/* 复核点：停下等一句话。这是用户选的那条——默认停，但给跳过的出口。 */
function stepReview(){
  var o = T('tag_out'), w = aiSpec(task(cur));
  var html = o ? o.innerHTML : '';
  if (o) o.innerHTML = html + '<div class="job stop"><div class="top">' +
    '<b>停一下</b><span>核一下合并得对不对：条数是不是太多或太少、有没有把两件事并成一件、有没有把该留的滤掉</span>' +
    '<span class="act"><button class="mini" onclick="jobGo(false)">继续</button>' +
    '<button class="mini" onclick="jobGo(true)">跳过复核，一路跑完</button></span></div></div>';
  jobBar();
}

function stepTag(){
  var o = T('tag_out');
  if (!TAG_MERGED) { stepFail('打标', '没有合并结果'); return; }
  if (o) o.innerHTML = '<div class="tagstep">第一步　合并去重</div><div class="tagtail">' + esc(TAG_MERGED) + '</div>' + ld('第二步　正在逐条打标');
  llmP(tagPrompt(2, task(cur)) + TAG_MERGED, 0).then(function(tagged){
    var o2 = T('tag_out');
    if (o2) o2.innerHTML = '<div class="tagstep">第一步　合并去重</div><div class="tagtail">' + esc(TAG_MERGED) + '</div>' +
                           '<div class="tagstep">第二步　打标</div>' + renderTag(tagged);
    JOB.i++; jobBar(); jobRun();
  }).catch(function(e){
    if (e && e.name === 'AbortError') return;
    stepFail('打标', e.message || e);
  });
}

function stepDraft(){
  var a = T('tag_out'), o = T('draft_out');
  var tagged = a ? a.textContent : '';
  if (!tagged || tagged.indexOf('|') === -1) { stepFail('成文', '没有打标结果'); return; }
  if (o) o.innerHTML = ld('正在出初稿');
  var tt = task(cur), sc = tt.selfcheck;
  var spec = typeSpec(sc.type_key) || { required_sections: [] };
  var fact = factLineOf(countTagged(tagged));
  var prompt = draftPrompt(tt, spec, fact, tagged);
  llmP(prompt, 0).then(function(txt){
    if (o) o.innerHTML = '<div class="tagtail">' + esc(txt) + '</div>';
    var d = T('draft');
    if (d) d.value = String(txt).replace(/^正在按模板成文\s*/, '');
    JOB.i++; jobBar(); jobRun();
  }).catch(function(e){
    if (e && e.name === 'AbortError') return;
    stepFail('成文', e.message || e);
  });
}

function stepCheck(){
  runSelfCheck();
  JOB.i++; jobBar(); jobRun();
}

function stepRead(){
  var o = T('llm_out');
  var t = task(cur), sc = t.selfcheck, draft = T('draft').value;
  if (!draft.trim()) { stepFail('AI 审读', '初稿框是空的', 'llm_out'); return; }
  if (o) { o.style.display = 'block'; o.innerHTML = ld('AI 正在审读'); }
  var res = runModules(draft, sc.type_key), found = [];
  for (var i = 0; i < res.length; i++) { if (res[i].items.length) found.push(MOD_SHORT[res[i].k] + ' ' + res[i].items.length + ' 项'); }
  llmP(readPrompt(draft, found), 0).then(function(txt){
    LLM_ITEMS = parseLlm(txt);
    if (o) o.innerHTML = renderLlm(txt);
    JOB.i++; jobBar(); jobRun();
  }).catch(function(e){
    if (e && e.name === 'AbortError') return;
    stepFail('AI 审读', e.message || e);
  });
}

/* ---------- 按这些改法重写一版 ---------- */
function llmRewrite(){
  var st = T('rw_state'), draft = T('draft').value;
  if (!st) return;
  if (!draft.trim()) { st.textContent = '初稿框是空的，先把稿子贴进来'; return; }
  if (!LLM_ITEMS || !LLM_ITEMS.length) { st.textContent = '先让 AI 读一遍，拿到改法再重写'; return; }
  var fixes = [];
  for (var i = 0; i < LLM_ITEMS.length; i++) {
    var it = LLM_ITEMS[i];
    if (!it.f) continue;
    fixes.push((i + 1) + '. 原句：' + (it.q || '（未给出）') + '\n   问题：' + (it.p || '') + '\n   改法：' + it.f);
  }
  if (!fixes.length) { st.textContent = '这一遍 AI 没给出具体改法，改不了'; return; }
  st.textContent = '正在重写…';
  var prompt = '下面是初稿与审读意见。请按意见改写初稿。\n' +
    '一、逐条落实每一条改法，不要漏。\n' +
    '二、不要新增原文没有的事实、数字或结论。\n' +
    '三、保持原有标题层级、栏目顺序与表格结构不变。\n' +
    '四、只输出改写后的全文，不要输出说明、变更清单、核对过程或任何开场白。\n' +
    '\n【审读意见】\n' + fixes.join('\n') + '\n\n【初稿】\n' + draft;
  llmP(prompt, 0).then(function(txt){
    T('draft').value = txt;
    st.textContent = '已重写并填进初稿框，请再核一遍';
    toast('已按改法重写，建议再跑一次规则检查');
  }).catch(function(e){
    if (e && e.name === 'AbortError') return;
    st.textContent = '没成功：' + (e.message || e);
  });
}

/* 审读与成文两段提示词抽出来，分步按钮与全程跑共用同一份，避免两处口径漂移。 */
function readPrompt(draft, found){
  return '你是游戏运营交付物的辅助审稿人。规则检查已经查过格式问题，你只找规则查不到的语义层问题。\n' +
    '最多提 5 条，每条严格按下面三行输出，不要多写一个字：\n' +
    '条目：<原文里的那句话，照抄>\n' +
    '问题：<属于下面四种的哪一种＋一句话说清>\n' +
    '改法：<给一句能直接替换上去的话；只是要删掉就写「删掉这句」>\n' +
    '只在这四种情况下才提：① 结论夸大到数据撑不住；② 对外承诺超过内部实际动作；' +
    '③ 同一件事在多处口径打架；④ 分类标签与问题根因对不上（例如把静态文案缺失写成服务器问题）。\n' +
    '以下情况一律不提：文风措辞、格式排版、你觉得"还能更好"但没错的地方、' +
    '已经写明是示例或占位符的地方、你自己不确定的猜测。\n' +
    '宁少勿滥：没有把握的不要写，真的没有上述四种问题就只回答：无。\n' +
    '不要输出思考过程、推理步骤、自我核对，不要写"让我看看""我再想想"这类话，也不要复述规则。\n' +
    '\n【初稿】\n' + draft.slice(0, 4000) + '\n【规则已发现】' + (found.join('；') || '无');
}

function draftPrompt(t, spec, fact, tagged){
  return '你是游戏运营的成文助手。按下面的栏目生成一份' + aiSpec(t).prod + '初稿。\n' +
    '必含栏目（一个都不能少，缺的在标题后标「（待补）」）：' + spec.required_sections.join('、') + '\n' +
    (fact ? '条数已经统计好了，直接用这组数，不要自己再数一遍：' + fact + '\n' : '') +
    '写法要求：\n' +
    '- 只写结构和事实：总量、分类分布、Top 议题、紧急项、未覆盖渠道说明\n' +
    '- **不要写结论和建议**，那部分留空，写「（此处由运营补结论）」\n' +
    '- 每个数字都要标出处，紧跟在数字后面写成「（来源：本期分类表）」。没标出处的数字会被自检工具拦下\n' +
    '- 引用玩家原话时必须同时写出处渠道\n' +
    '- 不用「史上」「最强」「永久」这类词，不承诺未定的版本号\n' +
    '- **只输出正文。** 不要输出你的核对过程、修正说明、自我质疑，也不要写「修正统计」「请再次核对」这类话\n' +
    '- 同一个统计只能出现一次，数一遍就定下来\n\n【整理结果】\n' + tagged.slice(0, 8000);
}

/* 审读结果存这里，供「按这些改法重写一版」用。 */
var LLM_ITEMS = [];

function llmAsk(prompt, temp, onOk, onErr){
  var c = llmCfg();
  if (!c.key) { onErr('这个文件里没有可用的访问凭据。'); return; }
  fetch(c.url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.key },
    body: JSON.stringify({ model: llmModel(), messages: [{ role: 'user', content: prompt }], temperature: temp })
  }).then(function(r){ return r.json(); }).then(function(j){
    if (j.error) { onErr('接口返回错误：' + (j.error.message || JSON.stringify(j.error).slice(0, 160))); return; }
    var txt = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
    if (!txt.trim()) { onErr('模型没有返回内容，把这段再跑一次通常就有。'); return; }
    onOk(txt);
  }).catch(function(e){ onErr('调用失败：' + e.message + '。多数是密钥不对，或这台机器连不上该接口。'); });
}

/* 打标：原始反馈 → 一张带置信度的表。
   关键在最后一列：拿不准的要它标出来并给两种可能，不许硬猜。
   这样人只用看被标红的那几条，不必逐条复核。 */
/* 打标分两步走，这一步的拆法有实测依据。
   把「合并 / 过滤 / 打标」塞进同一段提示词时，模型顾此失彼：
   实测四轮，每轮稳定执行的那几条都不一样，而且新加的指令会挤掉旧的
   （第四轮加了「已修复的标低」，紧急度对了，合并、过滤、置信度三条同时崩）。
   拆成两次调用后，合并与过滤的质量明显提升：同一份 32 条材料，
   单次调用并不出结果，拆开并成了 8 条。 */
/* AI 那一段要显示什么、用什么口径，按任务类型分。
   起因：这块原先照「玩家反馈日报」一个任务做的，被无差别套到全部任务上，
   点「活动上线前检查」看到的还是「贴原始反馈、出日报初稿」，明显不对。

   整理型：输入是零散材料，产出是结构化报告 —— 先整理成表，再成文。
   核稿型：输入已经是一份成稿 —— 只需要逐条挑毛病并给出改法。 */
function aiSpec(t){
  var k = ((t.selfcheck || {}).type_key) || '';
  var first = String(t.deliverable || '').split(/[+＋\/]/)[0].trim();
  if (k === 'feedback_table') {
    return { mode: 'organize', inw: '原始反馈', conv: '分类打标',
             step1: '把原始反馈变成表', step2: '出日报初稿', btn: '跑打标',
             ph: '把各渠道导出的原始反馈整段贴进来，一行一条，或点下面「选原始反馈文件」。不用先整理格式。',
             file: '选原始反馈文件', prod: '日报' };
  }
  if (k === 'report') {
    return { mode: 'organize', inw: '原始材料', conv: '归类整理',
             step1: '把原始材料变成表', step2: '出初稿', btn: '跑整理',
             ph: '把这次要整理的材料整段贴进来，一行一条，或点下面「选材料文件」。不用先整理格式。',
             file: '选材料文件', prod: first || '报告' };
  }
  return { mode: 'review', inw: '待核的成稿', conv: '逐项核对',
           step1: '', step2: '', btn: '', ph: '',
           file: '', prod: first || '成稿' };
}

/* report 类任务用的整理口径。feedback_table 用原来那套，不动。 */
var TAG_R1 = '下面是一次要整理的原始材料。做两件事，做完就停。\n' +
  '一、合并：说的是同一件事的多条内容合成一条。\n' +
  '二、去重与剔除：重复的、纯口号或纯情绪、不含可落地信息的内容剔掉；有具体内容但写得散的保留。\n' +
  '输出一份清单，每行一条，格式：编号 | 要点 | 来源 | 共N条提及\n' +
  '只输出这份清单，另起一段用「剔除说明：」写清剔了几条、为什么。\n' +
  '不要打标，不要写表格，不要写你的思考过程。\n\n【原始材料】\n';

var TAG_R2 = '你是游戏运营的整理助手。下面是已经合并去重过的材料清单，请逐条打标。\n' +
  '用 Markdown 表格输出，列固定为：序号 | 要点 | 来源 | 类别 | 影响面 | 紧急度 | 置信度 | 备选归类\n' +
  '字段口径：\n' +
  '- 类别：按这条材料的性质归，例如版本内容、用户反馈、数据表现、竞品动向、资源配置\n' +
  '- 影响面：说清涉及哪些玩家群体、系统或时段，能写多细写多细\n' +
  '- 紧急度：高／中／低。这里问的是要不要马上跟进，不是问题本身的严重度\n' +
  '- 置信度：高／中／低。材料里没写清、或者你为这条补了原文没有的判断，一律写低，并在最后一列给出另一种可能的归类\n' +
  '最后另起一段，用「待确认：」列出置信度为低的条目序号与理由。\n' +
  '不要输出思考过程、推理步骤和自我核对。\n\n【材料清单】\n';

/* 按任务类型取该用的提示词。 */
function tagPrompt(which, t){
  var isReport = (((t.selfcheck || {}).type_key) === 'report');
  if (which === 1) return isReport ? TAG_R1 : TAG_P1;
  return isReport ? TAG_R2 : TAG_P2;
}

var TAG_P1 = '下面是从各渠道导出的玩家原始反馈。做两件事，做完就停。\n' +
  '一、合并：说的是同一件事的多条反馈合成一条。\n' +
  '二、过滤：纯发泄、说不出具体问题的剔掉。语气激烈但讲了具体问题的要留。\n' +
  '输出一份清单，每行一条，格式：编号 | 摘要 | 来源渠道 | 共N条提及\n' +
  '只输出这份清单，另起一段用「剔除说明：」写清剔了几条、为什么。\n' +
  '不要打标，不要写表格，不要写你的思考过程。\n\n【原始反馈】\n';

var TAG_P2 = '你是游戏运营的反馈整理助手。下面是已经合并去重过的反馈清单，请逐条打标。\n' +
  '用 Markdown 表格输出，列固定为：序号 | 摘要 | 来源渠道 | 反馈类型 | 归属模块 | 影响范围 | 紧急度 | 可复现 | 置信度 | 备选归属\n' +
  '字段口径：\n' +
  '- 反馈类型：客户端、玩法系统、内容体验、版本、内容合规-本地化 五类里选一个\n' +
  '- 归属模块：具体到功能或系统名，例如货币战争、战斗系统UI这类，不要写「其他」\n' +
  '- 影响范围：写清机型、区服或人群特征，能写多细写多细\n' +
  '- 紧急度：高／中／低。这里问的是运营要不要跟进，不是问题本身的严重度；官方公告里已经修复的问题属于「已闭环」，标低\n' +
  '- 可复现：只对技术类缺陷填。照抄原文给的触发条件，原文写「特定情况下连续点击」就照写这句，不要自己推断成机型问题或普遍性问题，原文没提机型就不要写机型。剧情、手感、平衡感受这类主观体验一律写「—」，不要写「不适用」，与玩家反馈日报模板同一口径\n' +
  '- 置信度：高／中／低。下列情况必须写低：① 这条是玩家的方案建议而不是问题描述；② 分类处在两类边界；③ 你为这条补充了原文没有的判断。写低时在最后一列给出另一种可能的归属\n' +
  '- 内容合规-本地化：多语言、本地化文案缺失或错译归这一类，不要算作服务器或跨服问题\n' +
  '最后另起一段，用「待确认：」列出置信度为低的条目序号与理由。\n\n【反馈清单】\n';

/* 第一步的产出先存在这里。第二步要用它，重跑第一步时也要覆盖它。 */
var TAG_MERGED = '';

function runTag(){ tagStep1(); }

/* 第一步：合并与过滤。跑完先停住——合并得好不好，得人看一眼再往下走，
   否则错并的条目会顺着第二步一路传下去。这里给两个出口：「接着打标」和「重跑这一步」。 */
function tagStep1(){
  var raw = T('raw').value, out = T('tag_out'), sum = T('tag_sum');
  if (!raw || !raw.trim()) { sum.textContent = '先把原始反馈贴到上面'; return; }
  if (!llmCfg().key) { out.innerHTML = '<div class="llmnone">这个文件里没有可用的访问凭据，这一步先跳过。</div>'; return; }
  out.innerHTML = ld('第一步　正在合并与过滤，这步慢一些');
  sum.textContent = '';
  llmAsk(tagPrompt(1, task(cur)) + raw.slice(0, 8000), 0, function(merged){
    TAG_MERGED = merged;
    out.innerHTML = '<div class="tagstep">第一步　合并与过滤　<span>核这几件事：条数是不是太多或太少、有没有把两件事并成一件、有没有把该留的滤掉</span></div>' +
                    '<div class="tagtail">' + esc(merged) + '</div>' +
                    '<div class="acts">' +
                    '<button class="btn" onclick="tagStep2()">合并没问题，接着打标</button>' +
                    '<button class="btn g" onclick="tagStep1()">合并不对，重跑这一步</button>' +
                    '</div>';
    sum.textContent = '第一步完成。核完再点「接着打标」';
  }, function(msg){
    out.innerHTML = '<div class="llmraw">第一步没成功：' + esc(msg) + '</div>';
  });
}

/* 第二步：打标。拿的是第一步那份合并结果。 */
function tagStep2(){
  var out = T('tag_out'), sum = T('tag_sum');
  if (!TAG_MERGED) { sum.textContent = '先跑第一步'; return; }
  out.innerHTML = '<div class="tagstep">第一步　合并与过滤</div>' +
                  '<div class="tagtail">' + esc(TAG_MERGED) + '</div>' +
                  ld('第二步　正在打标，这步也慢一些');
  sum.textContent = '';
  llmAsk(tagPrompt(2, task(cur)) + TAG_MERGED, 0, function(tagged){
    out.innerHTML = '<div class="tagstep">第一步　合并与过滤</div>' +
                    '<div class="tagtail">' + esc(TAG_MERGED) + '</div>' +
                    '<div class="tagstep">第二步　打标</div>' + renderTag(tagged) +
                    '<div class="acts">' +
                    '<button class="btn g" onclick="tagStep1()">合并那步不对，重跑</button>' +
                    '</div>';
    var low = (out.innerHTML.match(/class="low"/g) || []).length;
    sum.textContent = low ? ('有 ' + low + ' 条标为待确认，先看这些；其余也过一眼')
                          : '打完了。这次没标出待确认，全表都得过一眼';
  }, function(m){ out.innerHTML += '<div class="llmraw">第二步没成功：' + esc(m) + '</div>'; });
}

/* 模型回的是 Markdown 表格。这里把它渲染成真表，并把低置信度的行标出来——
   人只需要盯这几行，其余抽看。这是「AI 打标、人只看存疑的」这条分工的落点。 */
function renderTag(txt){
  var lines = String(txt || '').split('\n');
  var rows = [], tail = [], inTable = false, done = false;
  for (var i = 0; i < lines.length; i++) {
    var ln = lines[i];
    var isRow = ln.trim().indexOf('|') === 0 || /^\s*\|/.test(ln);
    if (isRow) {
      if (done) { tail.push(ln); continue; }
      inTable = true;
      if (/^\s*\|[\s:|-]+\|\s*$/.test(ln)) continue;   // 分隔行
      var cells = ln.trim().replace(/^\||\|$/g, '').split('|');
      for (var c = 0; c < cells.length; c++) cells[c] = cells[c].trim();
      rows.push(cells);
    } else {
      if (inTable && ln.trim()) done = true;
      if (ln.trim()) tail.push(ln);
    }
  }
  if (!rows.length) return '<div class="llmraw">' + esc(txt) + '</div>';
  var head = rows[0], body = rows.slice(1);
  var h = '<div class="tagwrap"><table><thead><tr>';
  for (var j = 0; j < head.length; j++) h += '<th>' + esc(head[j]) + '</th>';
  h += '</tr></thead><tbody>';
  for (var r = 0; r < body.length; r++) {
    var hit = false;
    for (var k = 0; k < body[r].length; k++) {
      if (/^低$|^低[（(]/.test(body[r][k])) hit = true;
    }
    h += '<tr>';
    for (var q = 0; q < body[r].length; q++) {
      var cell = body[r][q];
      var cls = (hit && /^低$/.test(cell)) ? ' class="low"' : '';
      h += '<td' + cls + '>' + esc(cell) + '</td>';
    }
    h += '</tr>';
  }
  h += '</tbody></table></div>';
  if (tail.length) h += '<div class="tagtail">' + esc(tail.join('\n')) + '</div>';
  return h;
}

/* 统计这件事交给代码，不交给模型。
   实测：让模型自己数条数，它会在同一个段落里写「共 4 条」却列出 5 个序号——
   第一版还把矛盾写出来（自相矛盾的核对过程），加了一句「不要输出核对过程」之后，
   错误被藏起来了，反而更难发现。规则引擎也查不到这类错（D 模块查的是同一指标多值）。
   所以这里把打标表的条数先算准，再作为已知事实塞进成文提示词。 */
function countTagged(md){
  var lines = String(md || '').split('\n'), rows = [], head = null;
  for (var i = 0; i < lines.length; i++) {
    var s = lines[i].trim();
    if (s.charAt(0) !== '|') continue;
    if (/^\|[\s:|-]+\|$/.test(s)) continue;
    var cells = s.replace(/^\||\|$/g, '').split('|');
    for (var j = 0; j < cells.length; j++) cells[j] = cells[j].replace(/\*\*/g, '').trim();
    if (!head) { head = cells; continue; }
    if (cells.length) rows.push(cells);
  }
  if (!head || !rows.length) return null;
  var idx = {};
  for (var k = 0; k < head.length; k++) idx[head[k]] = k;
  function tally(colName){
    var ci = idx[colName], m = [], seen = {};
    if (ci == null) return null;
    for (var r = 0; r < rows.length; r++) {
      var v = (rows[r][ci] || '').trim() || '未填';
      if (seen[v] == null) { seen[v] = m.length; m.push({ name: v, n: 0 }); }
      m[seen[v]].n++;
    }
    return m;
  }
  return { total: rows.length, types: tally('反馈类型'), urgency: tally('紧急度') };
}

/* 把统计结果拼成一行「已知事实」，附在成文提示词后面 */
function factLineOf(cnt){
  if (!cnt) return '';
  var parts = ['总条数 ' + cnt.total + ' 条'];
  function add(label, arr){
    if (!arr || !arr.length) return;
    parts.push(label + '：' + arr.map(function(x){ return x.name + ' ' + x.n + ' 条'; }).join('、'));
  }
  add('按反馈类型', cnt.types);
  add('按紧急度', cnt.urgency);
  return parts.join('；');
}

/* 成文：打标结果 → 日报初稿。只出结构和事实，结论与建议留空等人补——
   这一步的分工在流程第 5 步已写明：「只填结构与事实，不写结论性判断」。 */
function runDraft(){
  var raw = T('raw').value, out = T('draft_out'), sum = T('draft_sum');
  var tagged = T('tag_out') ? T('tag_out').textContent : '';
  if (!tagged || tagged.indexOf('|') === -1) { sum.textContent = '先跑上一步的打标，或者直接把整理好的表贴到原始反馈框里'; return; }
  out.innerHTML = ld('正在按模板成文'); sum.textContent = '';
  var t = task(cur), sc = t.selfcheck;
  var spec = typeSpec(sc.type_key) || { required_sections: [] };
  var cnt = countTagged(tagged);
  var fact = factLineOf(cnt);
  var prompt = draftPrompt(t, spec, fact, tagged);
  llmAsk(prompt, 0.2, function(txt){
    out.innerHTML = '<div class="llmraw">' + esc(txt) + '</div>' +
      '<div class="acts"><button class="btn g" onclick="draftToCheck()">拿去做交付前自检</button></div>';
    sum.textContent = '初稿已生成。结论与建议是空的，接着自己补';
  }, function(msg){
    out.innerHTML = '<div class="llmraw">' + esc(msg) + '</div>';
  });
}

function draftToCheck(){
  var d = T('draft_out');
  if (!d) return;
  var t = d.textContent || '';
  T('draft').value = t.replace(/^正在按模板成文…\s*/, '');
  T('draft').scrollIntoView({ behavior: 'smooth', block: 'center' });
  toast('已填进自检框，点一下就能查');
}

function loadRaw(el){
  var f = el.files && el.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(){ T('raw').value = r.result; toast('已读入 ' + f.name); };
  r.readAsText(f, 'utf-8');
}

function resHtml(res){
  var total = 0, h = '';
  for (var i = 0; i < res.length; i++) {
    var r = res[i];
    total += r.items.length;
    if (!r.items.length) { h += '<div class="scmod"><b>' + esc(r.name) + '</b><span class="ok">未发现问题</span></div>'; continue; }
    h += '<div class="scmod"><b>' + esc(r.name) + '</b><span class="warn">' + r.items.length + ' 项</span>';
    for (var j = 0; j < r.items.length; j++) {
      var it = r.items[j];
      h += '<div class="scit"><span class="lv lv-' + esc(it.level) + '">' + esc(it.level) + '</span>' +
           '<span class="ln">行 ' + esc(it.line) + '</span>' +
           '<div class="tx">' + esc(it.text) + '</div>' +
           '<div class="is">' + esc(it.issue) + '</div>' +
           '<div class="sg">建议：' + esc(it.suggest) + '</div></div>';
    }
    h += '</div>';
  }
  return { html: h, total: total };
}

function runSelfCheck(){
  var t = task(cur), sc = t.selfcheck, txt = T('draft').value;
  if (!txt || !txt.trim()) { T('sc_sum').textContent = '还没粘初稿'; return; }
  var out2 = resHtml(runModules(txt, sc.type_key));
  T('sc_result').innerHTML = out2.html;
  T('sc_result2').innerHTML = '';
  T('sc_sum').textContent = '待处理项合计 ' + out2.total + ' 项' + (out2.total ? '，改完重跑至归零即可交付' : '，可直接交付');
  toast(out2.total ? '检出 ' + out2.total + ' 项待处理' : '未发现问题');
}

function runExtra(){
  var t = task(cur), sc = t.selfcheck, txt = T('draft').value;
  if (sc.extra === undefined) return;
  if (!txt || !txt.trim()) { T('sc_sum').textContent = '还没粘初稿'; return; }
  var out3 = resHtml(runModules(txt, sc.extra.type_key));
  T('sc_result2').innerHTML = '<div class="scmod" style="border-color:#ecdfc4;background:#fdf7ec">' +
    '<b>另按 ' + esc(sc.extra.type_key) + '（' + esc(sc.extra.type_name) + '）跑一次，合计 ' + out3.total + ' 项</b></div>' + out3.html;
  toast('另按 ' + sc.extra.type_key + ' 检出 ' + out3.total + ' 项');
}

/* ============ 例外提示 ============ */
T('ctx').addEventListener('input', function(){ checkTriggers(task(cur), this.value); });
function checkTriggers(t, text){
  var box = T('trg'); if(!box || !t) return;
  var hits = [];
  for (var i=0;i<t.triggers.length;i++){
    var g = t.triggers[i];
    for (var j=0;j<g.kw.length;j++){ if (text.indexOf(g.kw[j]) > -1){ hits.push(g); break; } }
  }
  box.innerHTML = hits.map(function(g){
    return '<div><b>触发「'+esc(g.kw.join(' / '))+'」</b>　'+esc(g.hint)+'</div>'; }).join('');
}

/* ============ 导出 ============ */
function buildSheet(){
  var t = task(cur); if(!t) return '';
  var cv = T('ctx').value.trim() || '（未填写）';
  var L = [];
  L.push('# 协作流程单｜' + t.name);
  L.push('');
  L.push('- 岗位：产品运营 & 活动运营（AI 方向）· 崩坏：星穹铁道');
  L.push('- 任务类型：' + t.name + '（' + t.line + '）');
  L.push('- 对应岗位任务：' + t.maps_to);
  L.push('- 交付物：' + t.deliverable);
  L.push('- 频率：' + t.cadence);
  L.push('- 本次的具体情况：' + cv.replace(/\n/g, ' '));
  L.push('');
  L.push('## 一、现在怎么做，卡在哪');
  L.push('');
  L.push('- 现在怎么做：' + t.current);
  L.push('- 卡在哪：' + t.bottleneck);
  L.push('');
  L.push('## 二、流程（共 ' + t.steps.length + ' 步）');
  L.push('');
  for (var k=0;k<t.steps.length;k++){
    var s = t.steps[k];
    L.push('### 第 ' + s.no + ' 步　' + s.title);
    L.push('');
    L.push('- 这一步要达成：' + s.goal);
    L.push('- AI 做什么：' + s.ai.action);
    L.push('    - 需要的信息：' + s.ai.needs.join('；'));
    L.push('- 人做什么：' + s.human.action);
    L.push('    - 人要拍的板：' + s.human.decides.join('；'));
    L.push('- 交接点：' + s.handoff + '。' + s.handoff_note);
    L.push('- 产出物：' + s.output);
    L.push('- 出错怎么办：');
    for (var e=0;e<s.on_error.length;e++){ L.push('    - 如果 ' + s.on_error[e].if + ' → ' + s.on_error[e].then); }
    L.push('- 判定依据：' + s.basis.tier + '｜' + s.basis.criteria.join('、') + '。' + s.basis.why);
    L.push('- 出处：' + s.source.join('；'));
    L.push('');
  }
  var sc = t.selfcheck;
  if (sc){
    L.push('## 三、交付前自检（交给自检工具）');
    L.push('');
    L.push('- 对应类型：' + sc.type_key + '（' + sc.type_name + '）');
    L.push('- 会跑的模块：' + modulesOf(sc.type_key).join('、'));
    L.push('- 写的时候就要对齐的栏目：' + sc.checkpoints.join('、'));
    L.push('- 怎么跑：' + sc.steps.join(' → '));
    L.push('    一条命令：python 跑自检.py <初稿路径> ' + sc.type_key);
    L.push('    或手工：cd 运营自检 && python run_all.py');
    if (sc.extra){ L.push('- 另跑一次：' + sc.extra.type_key + '（' + sc.extra.type_name + '）：' + sc.extra.checkpoints.join('、')); }
    L.push('');
  }
  L.push('## 四、分工小结');
  L.push('');
  var lead = 0;
  for (var m=0;m<t.steps.length;m++){ if (machineLead(t.steps[m])) lead++; }
  L.push('- 共 ' + t.steps.length + ' 步，其中 ' + lead + ' 步以机器为主，' + (t.steps.length-lead) + ' 步以人为主。');
  L.push('- 交给机器的：收集、规范化、分类打标、对照比对、按模板成文、逐项核对。');
  L.push('- 留在人这里的：定口径、定级、裁定以谁为准、写结论、对外表态、签字放行。');
  L.push('');
  L.push('## 五、流程出处');
  L.push('');
  for (var q=0;q<t.sources.length;q++){ L.push('- ' + t.sources[q]); }
  L.push('');
  return L.join('\n');
}
function copyLink(){
  var t = task(cur), sc = t.selfcheck;
  var s = '【交付前自检交接】' + t.name + '\n' +
          '- 自检工具里的类型：' + sc.type_key + '（' + sc.type_name + '）\n' +
          '- 本次要跑的模块：' + modulesOf(sc.type_key).join('、') + '\n' +
          '- 写的时候就要对齐的栏目：' + sc.checkpoints.join('、') + '\n' +
          '- 跑法：' + sc.steps.join(' → ') + '\n' +
          '  cd 运营自检 && python run_all.py\n' +
          (sc.extra ? '- 另跑一次：' + sc.extra.type_key + '（' + sc.extra.type_name + '）\n' : '');
  copyText(s, '已复制交接说明');
}
function toast(m){ var e = T('toast'); e.textContent = m; e.className = 'toast on'; setTimeout(function(){ e.className='toast'; }, 1700); }
function copyText(txt, msg){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast(msg); }, function(){ fb(txt,msg); });
  } else { fb(txt,msg); }
}
function fb(txt,msg){
  var ta = document.createElement('textarea'); ta.value = txt;
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast(msg); } catch(e){ toast('复制失败，请改用下载'); }
  document.body.removeChild(ta);
}
function copySheet(){ var s = buildSheet(); if(s) copyText(s, '已复制流程单'); }
function downloadSheet(){
  var s = buildSheet(); if(!s) return;
  var t = task(cur);
  var b = new Blob([s], {type:'text/markdown;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = '协作流程单_' + t.name + '.md';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('已下载');
}

/* 把稿子拖到页面任意位置：自动载入并一键跑完 */
['dragover', 'dragenter'].forEach(function(ev){
  document.addEventListener(ev, function(e){ e.preventDefault(); document.body.classList.add('dragging'); });
});
['dragleave', 'dragend'].forEach(function(ev){
  document.addEventListener(ev, function(e){ document.body.classList.remove('dragging'); });
});
document.addEventListener('drop', function(e){
  e.preventDefault();
  document.body.classList.remove('dragging');
  var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    T('draft').value = r.result;
    toast('已载入 ' + f.name + '，开始跑');
    runAll();
  };
  r.readAsText(f, 'utf-8');
});

/* 状态记忆：记住上次选的任务与打勾，下次打开接着用 */
function saveState(){
  try { localStorage.setItem('flow_state', JSON.stringify({ task: cur, done: done })); } catch (e) {}
}
function loadState(){
  try { return JSON.parse(localStorage.getItem('flow_state') || '{}'); } catch (e) { return {}; }
}
var __st = loadState();
if (__st && __st.done) { done = __st.done; }
if (__st && __st.task && task(__st.task)) { render(__st.task); } else { render(DATA.tasks[0].id); }
</script>
